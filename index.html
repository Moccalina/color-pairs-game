<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Pairs – 5-Level Memory Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            position: relative;
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        .app-container h1 {
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }

        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container .hidden {
            display: none !important;
        }

              #game-board {
            display: grid;
            grid-template-columns: repeat(var(--board-cols, 6), 1fr);
            gap: 5px;
            width: 100%;
            margin-top: 8px;
        }

        .card {
            position: relative;
            background-color: #374151;
            border: 1.5px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            touch-action: manipulation;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
            background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAxMDAgMTAwJyB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJz48Y2lyY2xlIGN4PSc1MCcgY3k9JzYwJyByPScxOCcgZmlsbD0ncmdiKDIyOSwyMzEsMjM1KScvPjxjaXJjbGUgY3g9JzI1JyBjeT0nNDUnIHI9JzcnIGZpbGw9J3JnYigyMjksMjMxLDIzNSknLz48Y2lyY2xlIGN4PSczOCcgY3k9JzI4JyByPSc4JyBmaWxsPSdyZ2IoMjI5LDIzMSwyMzUpJy8+PGNpcmNsZSBjeD0nNjInIGN5PScyOCcgcj0nOCcgcj0nOCcgcj0nOCcgZmlsbD0ncmdiKDIyOSwyMzEsMjM1KScvPjxjaXJjbGUgY3g9Jzc1JyBjeT0nNDUnIHI9JzcnIGZpbGw9J3JnYigyMjksMjMxLDIzNSknLz48L3N2Zz4=");
            background-size: 65%;
            background-repeat: no-repeat;
            background-position: center;
        }

        .card.turned {
            background-image: none !important;
            border: none;
            transform: scale(1.03);
        }

        .card:active {
            transform: scale(0.95);
        }

        .card.flipped,
        .card.matched {
            transform: rotateY(180deg);
        }

        .card.turned::after {
            content: attr(data-pair-label);
            position: absolute;
            top: 50%;
            left: 50%;
            padding: 0.2em 0.35em;
            border-radius: 999px;
            background-color: rgba(15, 23, 42, 0.75);
            color: #ffffff;
            font-size: clamp(9px, 2.5vw, 15px);
            font-weight: 700;
            line-height: 1;
            transform: translate(-50%, -50%) rotateY(180deg);
            pointer-events: none;
        }

        .card.matched {
            opacity: 0.4;
            cursor: default;
            pointer-events: none;
        }
        .color-selector-box .radio-label:nth-child(5) { grid-column: 2; }
        .color-selector-box .radio-label:nth-child(6) { grid-column: 3; }
        .color-selector-box .radio-label:nth-child(7) { grid-column: 4; }

        .radio-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 0;
            touch-action: manipulation;
        }

        .radio-label input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #3b82f6;
        }

        #intro-screen {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        .intro-content {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            margin: 16px;
        }

        #intro-start-btn {
            margin-top: 20px;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            background: #374151;
            color: white;
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .intro-card {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 4px;
            top: -35px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: fallDown linear forwards;
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg); }
            90% { transform: translateY(calc(100vh - 50px)) rotate(var(--rot)); }
            100% { transform: translateY(calc(100vh - var(--bottom-stop))) rotate(var(--rot)); }
        }

              .control-panel-box {
            width: 100%;
            max-width: 500px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            margin: 8px auto 12px auto;
            box-sizing: border-box;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            display: flex !important;
            flex-direction: column !important;
            gap: 10px !important;
        }

        .panel-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 6px;
        }

        #back-btn {
            padding: 6px 12px;
            font-size: 14px;
            background-color: #374151;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-family: sans-serif;
            font-weight: 600;
            min-width: 90px;
            text-align: center;
            touch-action: manipulation;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .panel-level-title {
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #3b82f6;
        }

        .panel-header-row::after {
            content: "";
            min-width: 90px;
            display: block;
        }

        .panel-stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .mini-stat {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 1px solid #f1f5f9;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .mini-label {
            font-family: sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #232323;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mini-value {
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
        }
        .color-selector-box {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            justify-items: center;
            column-gap: 8px;
            row-gap: 4px;
            width: 100%;
            box-sizing: border-box;
            background-color: #ffffff;
            padding: 6px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .panel-progress-wrapper {
            width: 100%;
            background-color: #eff2f5;
            border-radius: 9999px;
            position: relative;
            height: 24px;
            overflow: hidden;
        }

        .panel-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #cdd9ed, #9eb8e4);
            border-radius: 9999px;
            transition: width 0.4s ease-out;
        }

        .panel-progress-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #1e293b;
            white-space: nowrap;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-icon-wrapper {
            margin-bottom: 15px;
            animation: popIcon 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
        }

        @keyframes popIcon {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .modal-content h2 {
            font-family: sans-serif;
            color: #1e293b;
            font-size: 22px;
            margin: 10px 0 5px 0;
        }

        .modal-content p {
            font-family: sans-serif;
            color: #191e24;
            font-size: 15px;
            margin: 0 0 24px 0;
            line-height: 1.4;
        }

        #modal-close-btn {
            width: 100%;
            padding: 12px;
            background-color: #374151;
            color: white;
            border: 1px solid transparent;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .menu-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 16px 20px !important;
            font-family: sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #1e293b !important;
            background-color: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 12px !important;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.02), 0 2px 4px -1px rgba(15, 23, 42, 0.01);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
            position: relative;
            overflow: hidden;
        }

        #intro-start-btn:hover,
        #back-btn:hover,
        #modal-close-btn:hover {
            background-color: #eff6ff !important;
            border-color: #bfdbfe !important;
            color: #3b82f6 !important;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.12), 0 4px 6px -2px rgba(59, 130, 246, 0.08);
        }

        .menu-btn:hover {
            background-color: #f8fafc !important;
            border-color: #cbd5e1 !important;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.05), 0 4px 6px -2px rgba(15, 23, 42, 0.02);
        }

        .menu-btn:active {
            transform: translateY(0);
            background-color: #f1f5f9 !important;
        }

        .highscore-tag {
            font-size: 12px !important;
            font-weight: 600 !important;
            color: #64748b !important;
            background-color: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            transition: all 0.25s ease;
        }

        .menu-btn:hover .highscore-tag {
            color: #3b82f6 !important;
            background-color: #eff6ff;
            border-color: #bfdbfe;
        }

        .game-footer {
            margin-top: auto;
            padding-top: 24px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }

        .game-footer a {
            color: #64748b;
            text-decoration: none;
            margin: 0 6px;
        }

        .game-footer a:hover {
            text-decoration: underline;
        }

        .color-selector-box .radio-label:nth-child(5) { grid-column: auto; }
        .color-selector-box .radio-label:nth-child(6) { grid-column: auto; }
        .color-selector-box .radio-label:nth-child(7) { grid-column: auto; }

        .custom-mix-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            margin-top: -4px;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
        }

        .custom-mix-panel.hidden {
            display: none !important;
        }

        .custom-chip {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .custom-chip:has(input:checked) {
            border-color: #3b82f6;
            background: #eff6ff;
            transform: scale(1.05);
        }

        .custom-chip input {
            accent-color: #3b82f6;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="app-container">
        <div id="intro-screen">
            <div class="intro-content">
                <h1 style="align-items: center; color: #1f2937; display: flex; justify-content: center; font-family: sans-serif; font-size: 32px; gap: 6px;">

                </span>

        <h1 style="align-items: center; display: flex; font-family: sans-serif; gap: 3px;">
            <svg height="45" style="flex-shrink: 0; overflow: visible;" viewBox="0 0 200 200" width="45" xmlns="http://w3.org">
                <rect fill="#374151" height="70" rx="10" transform="rotate(45 125 75)" width="70" x="90" y="40"></rect>
                <rect fill="#9CA3AF" height="70" rx="10" width="70" x="40" y="80"></rect>

        <span style="color: #9ca3af; display: block; font-family: sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 2px; margin-bottom: 20px; margin-top: -4px; text-transform: uppercase;">

        <div class="screen" id="start-screen">

      <script>
        const tailwindPalette = {
            'yellow-orange': [
                '#fffbeb', '#fef3c7', '#fde68a', '#fcd34d', '#fbbf24', '#f59e0b', '#d97706', '#b45309', '#92400e', '#78350f',
                '#fff7ed', '#ffedd5', '#fed7aa', '#fdbb74', '#fda4af', '#f97316', '#ea580c', '#c2410c', '#9a3412', '#7c2d12'
            ],
            'red': [
                '#fef2f2', '#fee2e2', '#fecaca', '#fca5a5', '#f87171', '#ef4444', '#dc2626', '#b91c1c', '#991b1b', '#7f1d1d',
                '#fff5f5', '#fed7d7', '#feb2b2', '#fc8181', '#f56565', '#e53e3e', '#c53030', '#9b2c2c', '#742a2a', '#5c2525'
            ],
            'purple': [
                '#faf5ff', '#f3e8ff', '#e9d5ff', '#d8b4fe', '#c084fc', '#a855f7', '#9333ea', '#7e22ce', '#6b21a8', '#581c87',
                '#fdf4ff', '#fae8ff', '#f5d0fe', '#f0abfc', '#e879f9', '#d946ef', '#c026d3', '#a21caf', '#86198f', '#701a75'
            ],
            'blue': [
                '#f0f9ff', '#e0f2fe', '#bae6fd', '#7dd3fc', '#38bdf8', '#0ea5e9', '#0284c7', '#0369a1', '#075985', '#0c4a6e',
                '#eff6ff', '#dbeafe', '#bfdbfe', '#93c5fd', '#60a5fa', '#3b82f6', '#2563eb', '#1d4ed8', '#1e40af', '#1e3a8a'
            ],
            'green': [
                '#f0fdf4', '#dcfce7', '#bbf7d0', '#86efac', '#4ade80', '#22c55e', '#16a34a', '#15803d', '#166534', '#14532d',
                '#ecfdf5', '#d1fae5', '#a7f3d0', '#6ee7b7', '#34d399', '#10b981', '#059669', '#047857', '#065f46', '#064e3b'
            ],
            'grey': [
                '#f8fafc', '#f1f5f9', '#e2e8f0', '#cbd5e1', '#94a3b8', '#64748b', '#475569', '#334155', '#1e293b', '#0f172a',
                '#f9fafb', '#f3f4f6', '#e5e7eb', '#d1d5db', '#9ca3af', '#6b7280', '#4b5563', '#374151', '#1f2937', '#111827'
            ]
        };

        function arrayMischen(array) {
            let kopie = [...array];
            for (let i = kopie.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [kopie[i], kopie[j]] = [kopie[j], kopie[i]];
            }
            return kopie;
        }

        function holeAlleFarben() {
            let alle = [];
            Object.keys(tailwindPalette).forEach(key => {
                alle = alle.concat(tailwindPalette[key]);
            });
            return [...new Set(alle)];
        }

            const customMixPanel = document.getElementById('custom-mix-panel');
        const themeRadios = document.querySelectorAll('input[name="color-theme"]');
        const customCheckboxes = document.querySelectorAll('#custom-mix-panel input[type="checkbox"]');

        themeRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (radio.value === 'custom' && radio.checked) {
                    customMixPanel.classList.remove('hidden');
                } else {
                    customMixPanel.classList.add('hidden');
                }
            });
        });

        customCheckboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const checkedCount = document.querySelectorAll('#custom-mix-panel input[type="checkbox"]:checked').length;
                if (checkedCount === 0) {
                    cb.checked = true; // Mindestens 1 Farbe bleibt aktiv
                }
            });
        });

        function generiereFarben(anzahl, thema) {
            let gewaehlteThemen = [];

            if (thema === 'all') {
                gewaehlteThemen = Object.keys(tailwindPalette);
            } else if (thema === 'custom') {
                gewaehlteThemen = Array.from(document.querySelectorAll('#custom-mix-panel input[type="checkbox"]:checked'))
                    .map(cb => cb.value);
                if (gewaehlteThemen.length === 0) {
                    gewaehlteThemen = ['blue', 'purple'];
                }
            } else {
                gewaehlteThemen = [thema];
            }

            let pool = [];
            gewaehlteThemen.forEach(t => {
                if (tailwindPalette[t]) {
                    pool = pool.concat(tailwindPalette[t]);
                }
            });
            pool = arrayMischen([...new Set(pool)]);

            if (anzahl <= pool.length) {
                return pool.slice(0, anzahl);
            }

            let farbAuswahl = [...pool];
            const restBedarf = anzahl - pool.length;

            const hueConfig = {
                'yellow-orange': { start: 30, range: 25 },
                'red':           { start: 0,  range: 15 },
                'purple':        { start: 260, range: 40 },
                'blue':          { start: 190, range: 40 },
                'green':         { start: 100, range: 50 }
            };

            for (let i = 0; i < restBedarf; i++) {
                const aktuellesSubThema = gewaehlteThemen[i % gewaehlteThemen.length];
                if (aktuellesSubThema === 'grey' || thema === 'all') {
                    let helligkeit = 10 + ((i * 79) % 81);
                    farbAuswahl.push(`hsl(0, 0%, ${helligkeit}%)`);
                } else {
                    const cfg = hueConfig[aktuellesSubThema] || { start: 0, range: 360 };
                    let feinerHue = (cfg.start + ((i * 7) % cfg.range)) % 360;
                    let feineSaettigung = 60 + ((i * 13) % 36);
                    let feineHelligkeit = 25 + ((i * 17) % 51);
                    farbAuswahl.push(`hsl(${feinerHue}, ${feineSaettigung}%, ${feineHelligkeit}%)`);
                }
            }

            return arrayMischen([...new Set(farbAuswahl)]);
        }


        let farbPool = [];
        let ausgewaehlteKarten = [];
        let umgedrehteKarten = [];
        let paarTimeout = null;
        let siegTimeout = null;
        let zuege = 0;
        let gefundenePaare = 0;
        let aktuellePaarAnzahl = 0;
        let aktuellesLevelKey = "";

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const gameBoard = document.getElementById('game-board');
        const moveCounter = document.getElementById('move-value');
        const currentHighscoreView = document.getElementById('highscore-value');
        const pairCounter = document.getElementById('pair-counter');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const levelTitle = document.getElementById('current-level-title');
        const backBtn = document.getElementById('back-btn');
        const menuButtons = document.querySelectorAll('.menu-btn');
        const successModal = document.getElementById('success-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');

        updateHighscoreAnzeigeImMenue();

        menuButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                const targetBtn = e.target.closest('.menu-btn');
                const paare = parseInt(targetBtn.getAttribute('data-pairs'));
                aktuellesLevelKey = targetBtn.id.replace('btn-', '');
                const vollerText = targetBtn.textContent;
                const name = vollerText.split('Dein Highscore').shift().trim();
                starteSpiel(paare, name);
            });
        });

        backBtn.addEventListener('click', zeigeStartmenue);

                function starteSpiel(anzahlPaare, levelName) {
            clearTimeout(paarTimeout);
            clearTimeout(siegTimeout);
            paarTimeout = null;
            siegTimeout = null;
            zuege = 0;
            gefundenePaare = 0;
            aktuellePaarAnzahl = anzahlPaare;
            umgedrehteKarten = [];

            const gewaehltesThema = document.querySelector('input[name="color-theme"]:checked').value;

            levelTitle.textContent = levelName;
            moveCounter.textContent = zuege;

            if (pairCounter) pairCounter.style.display = 'block';
            if (progressBar) progressBar.style.width = '0%';
            if (progressText) progressText.textContent = `0 / ${aktuellePaarAnzahl} Paare`;

            gameBoard.innerHTML = '';

            const gespeicherterRekord = localStorage.getItem(`memory_highscore_${aktuellesLevelKey}`);
            currentHighscoreView.textContent = gespeicherterRekord ? gespeicherterRekord : `--`;

            let spalten = 6;
            if (anzahlPaare >= 48) {
                spalten = 8;
            }

            gameBoard.style.setProperty('--board-cols', spalten);
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            farbPool = generiereFarben(anzahlPaare, gewaehltesThema);
            const paarKennzeichnungen = new Map(
                farbPool.map((farbe, index) => [farbe, String(index + 1).padStart(2, '0')])
            );
            ausgewaehlteKarten = arrayMischen([...farbPool, ...farbPool]);

            ausgewaehlteKarten.forEach((farbe, index) => {
                const karte = document.createElement('div');
                karte.classList.add('card');
                karte.setAttribute('data-index', index);
                karte.setAttribute('data-color', farbe);
                karte.setAttribute('data-pair-label', paarKennzeichnungen.get(farbe));
                karte.addEventListener('click', karteUmdrehen);
                gameBoard.appendChild(karte);
            });
        }

        function karteUmdrehen() {
            const angeklickteKarte = this;
            if (angeklickteKarte.classList.contains('flipped') ||
                angeklickteKarte.classList.contains('matched') ||
                umgedrehteKarten.length >= 2) {
                return;
            }

            const farbe = angeklickteKarte.getAttribute('data-color');
            angeklickteKarte.classList.add('turned', 'flipped');
            angeklickteKarte.style.backgroundColor = farbe;

            umgedrehteKarten.push(angeklickteKarte);

            if (umgedrehteKarten.length === 2) {
                zuege++;
                moveCounter.textContent = zuege;
                paarTimeout = setTimeout(() => {
                    paarTimeout = null;
                    pruefePaar();
                }, 600);
            }
        }

        function pruefePaar() {
            if (umgedrehteKarten.length !== 2) {
                return;
            }

            const [karte1, karte2] = umgedrehteKarten;
            const farbe1 = karte1.getAttribute('data-color');
            const farbe2 = karte2.getAttribute('data-color');

            if (farbe1 === farbe2) {
                karte1.classList.add('matched');
                karte2.classList.add('matched');
                gefundenePaare++;

                const prozent = (gefundenePaare / aktuellePaarAnzahl) * 100;
                if (progressBar) progressBar.style.width = prozent + '%';
                if (progressText) progressText.textContent = `${gefundenePaare} / ${aktuellePaarAnzahl} Paare`;

                umgedrehteKarten = [];

                if (gefundenePaare === aktuellePaarAnzahl) {
                    siegTimeout = setTimeout(() => {
                        siegTimeout = null;
                        pruefeUndSpeichereHighscore();
                        zeigeStartmenue();
                    }, 500);
                }
            } else {
                karte1.classList.remove('flipped', 'turned');
                karte2.classList.remove('flipped', 'turned');
                karte1.style.backgroundColor = '';
                karte2.style.backgroundColor = '';
                umgedrehteKarten = [];
            }
        }

        function pruefeUndSpeichereHighscore() {
            const alterRekord = localStorage.getItem(`memory_highscore_${aktuellesLevelKey}`);
            const levelNameText = levelTitle.textContent;

            if (!alterRekord || zuege < parseInt(alterRekord)) {
                localStorage.setItem(`memory_highscore_${aktuellesLevelKey}`, zuege);
                modalTitle.textContent = "🎉 Neuer Rekord!";
                modalMessage.innerHTML = `Du hast <strong>${levelNameText}</strong> mit meisterhaften <strong>${zuege} Zügen</strong> gelöst!`;
            } else {
                modalTitle.textContent = "🥳 Gut gemacht!";
                modalMessage.innerHTML = `Du hast <strong>${levelNameText}</strong> in <strong>${zuege} Zügen</strong> erfolgreich gelöst.`;
            }

            if (successModal) successModal.classList.add('active');
            updateHighscoreAnzeigeImMenue();
        }

        function updateHighscoreAnzeigeImMenue() {
            const levels = ['lvl1', 'lvl2', 'lvl3', 'lvl4', 'lvl5'];
            levels.forEach(lvl => {
                const scoreTag = document.getElementById(`score-${lvl}`);
                if (scoreTag) {
                    const rekord = localStorage.getItem(`memory_highscore_${lvl}`);
                    scoreTag.textContent = rekord ? `Dein Highscore: ${rekord} Züge` : `Dein Highscore: --`;
                }
            });
        }

        function zeigeStartmenue() {
            clearTimeout(paarTimeout);
            clearTimeout(siegTimeout);
            paarTimeout = null;
            siegTimeout = null;
            umgedrehteKarten = [];
            if (pairCounter) pairCounter.style.display = 'none';
            gameScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }

        document.getElementById('modal-close-btn').addEventListener('click', () => {
            if (successModal) successModal.classList.remove('active');
            zeigeStartmenue();
        });

        document.querySelectorAll('input[name="color-theme"]').forEach(radio => {
            radio.addEventListener('change', () => {
                if (!gameScreen.classList.contains('hidden')) {
                    starteSpiel(aktuellePaarAnzahl, levelTitle.textContent);
                }
            });
        });

        document.addEventListener("DOMContentLoaded", () => {
            const introScreen = document.getElementById("intro-screen");
            const startBtn = document.getElementById("intro-start-btn");

            const alleFarben = holeAlleFarben();
            const gelbOrangeFarben = [...tailwindPalette['yellow-orange']];
            const farbZaehler = {};

            let kartenZaehler = 0;
            const maxKarten = 65;

            function werfeKarte() {
                if (kartenZaehler >= maxKarten) {
                    clearInterval(introIntervall);
                    return;
                }

                let zufaelligeFarbe;
                let versuche = 0;

                while (versuche < 100) {
                    if (kartenZaehler < 10) {
                        zufaelligeFarbe = gelbOrangeFarben[Math.floor(Math.random() * gelbOrangeFarben.length)];
                    } else {
                        zufaelligeFarbe = alleFarben[Math.floor(Math.random() * alleFarben.length)];
                    }

                    if (!farbZaehler[zufaelligeFarbe]) {
                        farbZaehler[zufaelligeFarbe] = 0;
                    }

                    if (farbZaehler[zufaelligeFarbe] < 2) {
                        farbZaehler[zufaelligeFarbe]++;
                        break;
                    }
                    versuche++;
                }

                const karte = document.createElement("div");
                karte.classList.add("intro-card");

                const startX = Math.random() * 95;
                const fallDauer = 2.5 + Math.random() * 1.5;
                const rotation = Math.random() * 720 - 360;
                const bodenStapel = 25 + (Math.random() * 65);

                karte.style.left = `${startX}%`;
                karte.style.backgroundColor = zufaelligeFarbe;
                karte.style.animationDuration = `${fallDauer}s`;
                karte.style.setProperty('--rot', `${rotation}deg`);
                karte.style.setProperty('--bottom-stop', `${bodenStapel}px`);

                introScreen.appendChild(karte);
                kartenZaehler++;
            }

            const introIntervall = setInterval(werfeKarte, 10);

            startBtn.addEventListener("click", () => {
                clearInterval(introIntervall);
                introScreen.style.transition = "opacity 0.5s ease-out";
                introScreen.style.opacity = "0";
                setTimeout(() => {
                    introScreen.remove();
                }, 500);
            });
        });
    </script>
</body>
</html>
